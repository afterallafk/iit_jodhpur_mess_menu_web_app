<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IITJ Mess Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f0e0c" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="images/IITJ_WHITE.png" />
  <link rel="apple-touch-icon" href="images/IITJ_WHITE.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">

    <!-- HEADER -->
    <header class="fade-in">
      <div class="header-left">
        <div class="logo-ring">
          <img
            src="images/IITJ_COLOURED.png"
            alt="IITJ Logo"
            onerror="this.parentElement.innerHTML='<span class=logo-initials>IITJ</span>'"
          />
        </div>
        <div class="header-title">
          <h1>Mess Menu Board</h1>
          <p>IIT Jodhpur &nbsp;·&nbsp; July 2026</p>
        </div>
      </div>
      <div class="mess-toggle">
        <button class="mess-btn active" data-mess="veg">🌿 Veg Mess</button>
        <button class="mess-btn" data-mess="nonveg">🍗 Non-Veg Mess</button>
      </div>
    </header>

    <!-- STATUS BAR -->
    <div class="status-bar fade-in">
      <div class="status-left">
        <div class="live-dot"></div>
        <span class="status-text" id="statusText">Loading menu…</span>
      </div>
      <div class="tip-pill">
        <span class="highlight">Today</span>
        <span>is auto-highlighted below</span>
      </div>
    </div>

    <!-- DAY STRIP -->
    <div class="day-strip fade-in" id="dayStrip"></div>

    <!-- MEALS -->
    <div class="meals-section">
      <div class="meals-header">
        <h2 id="mealsTitle">—</h2>
        <span class="day-badge" id="dayBadge" style="display: none;"></span>
      </div>
      <div class="meals-grid" id="mealsGrid">
        <div class="empty-state">
          <div class="empty-icon">🍽️</div>
          <div>Select a day to view its meal plan</div>
        </div>
      </div>
    </div>

  </div>

  <!-- App logic -->
  <script src="app.js"></script>
</body>
</html>
